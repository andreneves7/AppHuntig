apply plugin: 'com.android.application'

apply plugin: 'kotlin-android'

apply plugin: 'com.google.gms.google-services'
apply plugin: 'com.android.application'
apply plugin: 'com.google.firebase.crashlytics'

// Configuração de assinatura para releases — lê as credenciais de um ficheiro
// keystore.properties LOCAL (nunca commitado, ver .gitignore) em vez de as
// colocar diretamente aqui. Ver docs/RELEASE_CHECKLIST.md para os passos
// completos de como criar a keystore e este ficheiro.
def keystorePropertiesFile = rootProject.file("keystore.properties")
def keystoreProperties = new Properties()
def temKeystoreConfigurada = keystorePropertiesFile.exists()
if (temKeystoreConfigurada) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}


android {
    compileSdkVersion 33
    buildFeatures {
        viewBinding true
    }

    signingConfigs {
        release {
            if (temKeystoreConfigurada) {
                storeFile rootProject.file(keystoreProperties['storeFile'])
                storePassword keystoreProperties['storePassword']
                keyAlias keystoreProperties['keyAlias']
                keyPassword keystoreProperties['keyPassword']
            }
        }
    }

    defaultConfig {
        applicationId "com.company.HuntigEvents"
        minSdkVersion 21
        targetSdkVersion 33
        versionCode 1
        versionName "1.0"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (temKeystoreConfigurada) {
                signingConfig signingConfigs.release
            }
            // ⚠️ minifyEnabled está a "false" propositadamente. As regras de
            // ProGuard/R8 em proguard-rules.pro já estão preparadas para Firebase,
            // Maps e Glide, mas NUNCA foram testadas com uma compilação real (ver
            // docs/RELEASE_CHECKLIST.md). Só mudar para "true" depois de testares
            // uma build de release completa no teu telemóvel.
        }
    }


    compileOptions {
        sourceCompatibility = 1.8
        targetCompatibility = 1.8
    }
    kotlinOptions {
        jvmTarget = "1.8"
    }
    namespace 'com.example.app'

}

dependencies {

    implementation platform('com.google.firebase:firebase-bom:26.1.0')

    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation "org.jetbrains.kotlin:kotlin-stdlib-jdk7:$kotlin_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.core:core-ktx:1.10.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'com.google.firebase:firebase-auth:22.1.0'
    implementation 'com.google.firebase:firebase-messaging-ktx:23.4.1'


//    implementation'com.android.support:appcompat-v7:26.1.0'
//
//    implementation'com.android.support:design:26.1.0'
//    implementation'com.android.support.constraint:constraint-layout:1.1.2'
//    implementation 'com.google.android.material:material:1.1.0'
//
//    androidTestImplementation('com.android.support.test.espresso:espresso-core:3.0.2',{
//        exclude group:'com.android.support', module:'support-annotations'
//    })


    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.google.android.libraries.places:places:3.2.0'

//    implementation 'com.google.android.gms:play-services-location:17.0.0'
//    implementation 'com.google.android.libraries.places:places:2.2.0'
//    implementation 'com.android.support:design:28.0.0'

    implementation 'com.google.firebase:firebase-database:20.2.2'
    implementation 'com.google.firebase:firebase-crashlytics:18.4.0'
//    implementation 'com.crashlytics.sdk.android:crashlytics:2.10.1'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.google.firebase:firebase-auth-ktx:22.1.0'

    // Navigation Component — usado para a nova arquitetura baseada em
    // Fragments (ver docs/PLANO_DESENVOLVIMENTO.md, prova de conceito com
    // FiltrosFragment). Documentação oficial:
    // https://developer.android.com/guide/navigation/get-started
    implementation 'androidx.navigation:navigation-fragment-ktx:2.7.5'
    implementation 'androidx.navigation:navigation-ui-ktx:2.7.5'

    // QR code: geração (core) e leitura (embedded, fornece um ecrã de câmara
    // pronto a usar via IntentIntegrator, sem precisar de configurar CameraX
    // manualmente). Bibliotecas amplamente usadas e estáveis, mas — tal como
    // tudo o resto nesta sessão — nunca compiladas neste ambiente; testar
    // com atenção redobrada por serem dependências completamente novas.
    implementation 'com.google.zxing:core:3.5.2'
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'

    // Pull-to-refresh
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'

    // Login por biometria (impressão digital / reconhecimento facial)
    implementation 'androidx.biometric:biometric:1.1.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.1.5'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.5.1'
}
